# yaml-language-server: $schema=../../schema/server.schema.json
# A full-featured example deployment ("Lighthouse"): every optional feature switched on, with made-up values
# that identify nobody. The tests use it as the reference deployment (rendering, branding, client, hardening);
# start your own from template/ (`mcctl init`), not from here.
#
# Names: the zone and logins use the never-delegated .internal TLD and the Discord ids are invented, so nothing
# here points at a real server. Everything not set is the product default (schema/server.schema.json).
schema_version: 1
name: lighthouse
admin:
  name: Sam
  tailscale_login: keeper@github
  email: keeper@lighthouse.internal
github: {owner: lighthouse-admin, config_repo: lighthouse-mc-config, environments: true}
state: {bucket: lighthouse-tfstate, key: minecraft-server/terraform.tfstate}
dns: {zone: lighthouse.internal, hostname: mc}
cloudflare: {token_owner: account}
host:
  # ipv4 / ipv6: set once the host exists (`mcctl config set host.ipv6 ...`).
  tailscale_name: lighthouse-mc
  timezone: UTC
  resize_hint: a host with dedicated cores or more RAM
# strict_whitelist: explicit, so the golden rendering doesn't move with the default (players never in
# players.yml are kept and announced; true = players.yml is the whole whitelist).
minecraft: {version: "26.3", accept_eula: true, motd: "Lighthouse", strict_whitelist: false}
# v1.5 smooth backups (the defaults, spelled out): a timer run skips an idle, unchanged world and waits up to 15
# minutes while players see lag; `save-all` without flush unless the files stay busy; no upload limit.
backups:
  bucket: lighthouse-backups
  skip_when_idle: true
  defer_when_busy: true
  max_defer_minutes: 15
  gentle_save: true
  upload_limit_kib: 0
# v1.4: Chunky pre-generation while nobody is online: each bordered dimension up to its border, then 1024 blocks
# beyond the farthest generated chunk (frontier), never past 10000 blocks from 0,0 (the defaults, spelled out).
world:
  pregenerate: {enabled: true, frontier: true, margin: 1024, max_radius: 10000}
jvm: {gc: zgc, heap_mb: 6144}
performance:
  profile: vanilla
  view_distance: 12
  cpu_affinity: split
  noatime: true
  vm: default   # v1.5: small = the 2-4 GB preset (heap, helper memory caps, view distance <= 8)
panel: {mode: cloudflare}   # access.emails: [admin.email] (derived)
# v1.4: the Rust agent (smallworld-agent, telemetry in-process), the default since v1.4.0; python is the fallback.
agent: {implementation: rust}
experience: {enabled: true}
alerts: {discord: true}
discord:
  commands: true
  application_id: "100000000000000001"
  public_key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  guild_id: "100000000000000002"
  channel_ids: ["100000000000000003"]
  user_ids: ["100000000000000004"]
  helper_user_ids: ["100000000000000005"]
deploy: {enabled: true}
# v1.3: deploys restart Minecraft only 04:00-07:00 (Dublin time); outside it the restart waits for the window.
maintenance:
  window: "04:00-07:00"
  timezone: Europe/Dublin
  force_after_minutes_before_end: 30   # players online: wait for an empty server until 06:30, then countdown
branding:
  name: Lighthouse
  # explicit colours (not the product defaults): navy, signal red, foam
  colors: {text: "#F4F1EA", accent: "#E4572E", secondary: "#1D3557", subtle: "#A8DADC"}
  motd:
    - "&f&lLight&c&lhouse &8| &7Keep the lamp lit"
    - "&7A small survival world by the sea"
  icon: art/server-icon.png
  rules:
    - Be kind.
    - Don't grief or steal.
    - No cheats or hacked clients (visual mods are fine).
    - "Have fun {glyph}"   # the pack's glyph (resource_pack.glyph); nothing for players without the pack
  discord_invite: https://discord.gg/lighthouse
  website: https://www.lighthouse.internal/
  join:
    first_join: "Welcome to {server}, {player}! {glyph} Warm up by the lamp and stay a while"
    welcome_back: "Welcome back, {player} — last seen {ago} ago"
  hud:
    default_mode: top
    # v1.4.1: the parts everyone sees until they change their own (/hud show|hide <part>, /hud minimal,
    # /hud full, /hud reset); default: all of name, players, health, tps, mspt, ping, fps
    parts: [name, players, health, tps, ping, fps]
  drink:
    enabled: true
    name: Cocoa Mug
    command: cocoa                 # /cocoa
    texture: art/cocoa-mug.png     # 16x16, in the resource pack
    lore: ["Always warm.", "A hint of cinnamon."]
    color: "#6F4E37"
  resource_pack:
    enabled: true
    prompt: "Lighthouse textures: the cocoa mug"
    description: "The cocoa mug and the lamp glyph of Lighthouse"
    glyph: art/glyph.png           # 8x8
  holograms:                       # v1.2: floating texts at spawn
    - {x: 0, y: 72, z: 0, lines: ["Welcome to {server} {glyph}", "{players} online"], health: true}
    - {at: spawn, lines: ["New here? Start with these"], help: true}   # v1.3: above the world spawn, /help's list
  compass:                         # v1.3: the friend compass (a boss bar; /compass on|off|hide)
    enabled: true
    default_on: true
    max_range: 2000
    distance_rounding: 10
    height_threshold: 8
  pocket_map: {enabled: true, prerender: true}   # v1.3: /map; v1.4: unexplored terrain from the nightly map render
  map_room:                        # v1.4: a 4x3 wall of pre-rendered maps, 6 blocks north of spawn, facing it
    enabled: true
    world: overworld
    at: spawn
    offset: [0, 0, -6]
    facing: south
    width: 4
    height: 3
    view: border                   # the whole world border; `spawn` = vanilla's map grid at `scale` around spawn
    scale: 3
    cursors: true
map:                               # v1.4: nightly world map pre-render (pocket map + map room)
  enabled: true
  schedule: "*-*-* 02:41"          # quiet hours, before maintenance.window
  dimensions: [overworld, end]     # never the Nether
  radius: null                     # null = each dimension's world border
  threads: 1
client: {enabled: true}
