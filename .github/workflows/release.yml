name: release

# Runs CI, checks the tag against pyproject.toml / mcctl.__version__ / CHANGELOG.md, and creates the GitHub
# release. Two ways in (docs/reference.md "Releasing"):
#   - workflow_call from autotag.yml: a merge to main that raised the version (scripts/release.py ship) is tagged
#     there with GITHUB_TOKEN, and a tag pushed with GITHUB_TOKEN starts no workflow, so autotag calls this one
#     with the tag as an input;
#   - push of a tag vX.Y.Z by a person (the fallback, scripts/release.py tag --push).
# From autotag, a clean merge of a pull request whose head passed a full CI run reuses it (job `reuse`); a tag
# push always runs CI.
# Config repos then pin the tag's commit SHA (their weekly update task opens the PR, P11).
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: The release tag vX.Y.Z (autotag.yml has just created it on the commit being released)
        type: string
        required: true
    secrets:
      PUBLISH_DENYLIST: # ci.yml's publication job (autotag.yml passes it explicitly)
        required: false

permissions:
  contents: read

jobs:
  # Called by autotag.yml only: when the tagged commit is the clean merge of a pull request whose head already
  # passed a full ci.yml run with the same tree, that run is reused instead of repeating it (docs/ci.md
  # "Releases"; `release.py ci-reuse`, read-only API calls). Any doubt, a failure of this job included, and every
  # tag a person pushes run CI as before.
  reuse:
    if: ${{ inputs.tag != '' && github.ref_type != 'tag' }} # autotag.yml's call, never a pushed tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the checkout, the commits and the compare
      pull-requests: read # the pull request the merge commit belongs to
      actions: read # ci.yml's runs and their jobs
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Did the merged pull request already pass a full CI run?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/release.py ci-reuse --repo "$REPO" --sha "$(git rev-parse HEAD)"

  ci:
    needs: reuse
    if: ${{ !cancelled() && (github.ref_type == 'tag' || needs.reuse.outputs.reuse != 'true') }}
    uses: ./.github/workflows/ci.yml
    with:
      full: true # everything: a release isn't scoped to the last diff
    permissions:
      contents: write # requested by the reusable workflow's panel-merge job (P10; never runs from here)
      pull-requests: write # same
      id-token: write # requested by the reusable workflow's deploy job (never runs from the product's CI)
    secrets:
      PUBLISH_DENYLIST: ${{ secrets.PUBLISH_DENYLIST }} # ci.yml's publication job (docs/publishing.md)

  release:
    needs: [reuse, ci]
    # CI passed here, or was skipped because `reuse` found the pull request's passed full run.
    if: >-
      ${{ !cancelled() && (needs.ci.result == 'success'
      || (needs.ci.result == 'skipped' && needs.reuse.outputs.reuse == 'true' && github.ref_type != 'tag')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Check the tag matches the version and the changelog
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py check "$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          # Release checksums (design §7 supply chain): the source archive of the tagged commit and its
          # SHA-256, so a download can be checked against what this run built from the tag.
          name="smallworld-${TAG#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$RUNNER_TEMP/$name.tar.gz" HEAD
          (cd "$RUNNER_TEMP" && sha256sum "$name.tar.gz" > SHA256SUMS && cat SHA256SUMS)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/$name.tar.gz" "$RUNNER_TEMP/SHA256SUMS"
