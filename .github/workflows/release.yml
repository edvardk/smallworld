name: release

# Runs CI, checks the tag against pyproject.toml / mcctl.__version__ / CHANGELOG.md, and creates the GitHub
# release. Two ways in (docs/reference.md "Releasing"):
#   - workflow_call from autotag.yml: a merge to main that raised the version (scripts/release.py ship) is tagged
#     there with GITHUB_TOKEN, and a tag pushed with GITHUB_TOKEN starts no workflow, so autotag calls this one
#     with the tag as an input;
#   - push of a tag vX.Y.Z by a person (the fallback, scripts/release.py tag --push).
# Config repos then pin the tag's commit SHA (their weekly update task opens the PR, P11).
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: The release tag vX.Y.Z (autotag.yml has just created it on the commit being released)
        type: string
        required: true
    secrets:
      PUBLISH_DENYLIST: # ci.yml's publication job (autotag.yml passes it explicitly)
        required: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      full: true # everything: a release isn't scoped to the last diff
    permissions:
      contents: write # requested by the reusable workflow's panel-merge job (P10; never runs from here)
      pull-requests: write # same
      id-token: write # requested by the reusable workflow's deploy job (never runs from the product's CI)
    secrets:
      PUBLISH_DENYLIST: ${{ secrets.PUBLISH_DENYLIST }} # ci.yml's publication job (docs/publishing.md)

  release:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Check the tag matches the version and the changelog
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py check "$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          # Release checksums (design §7 supply chain): the source archive of the tagged commit and its
          # SHA-256, so a download can be checked against what this run built from the tag.
          name="smallworld-${TAG#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$RUNNER_TEMP/$name.tar.gz" HEAD
          (cd "$RUNNER_TEMP" && sha256sum "$name.tar.gz" > SHA256SUMS && cat SHA256SUMS)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/$name.tar.gz" "$RUNNER_TEMP/SHA256SUMS"
