# Static musl binaries, linked with the lld that ships with the Rust toolchain (rust-lld): no C toolchain, no
# cross-linker and no system libraries are needed for either architecture, here or in CI.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
