[package]
name = "smallworld-rcon"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Drop-in for the command line of Smallworld's scripts/mc_rcon.py (RCON client for the local Minecraft server)"
license = "MIT"
publish = false

# No dependencies: std only (CLAUDE.md "Rust workspace"; tests/test_rust_rcon.py enforces it).
[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The comments name files and Python identifiers in prose (mc_rcon.py, server.properties): not code to backtick.
doc_markdown = "allow"
