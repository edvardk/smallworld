# mc-brand (design §8 P17): built by scripts/build_plugin.py, never edited on the server.
name: mc-brand
version: 1.0.0
main: io.github.edvardk.mcbrand.BrandPlugin
api-version: '1.13'
description: The server's branding - join greeting, rules, Discord link, an optional HUD, the signature drink, the friend compass, the pocket map and /help.
load: POSTWORLD
commands:
  rules:
    description: The server rules.
    usage: /rules [page]
    permission: mcbrand.rules
  discord:
    description: The server's Discord invite.
    permission: mcbrand.discord
  drink:
    description: Get your drink back if you lost it (one at a time; branding.drink.command adds its own name).
    permission: mcbrand.drink
  hud:
    description: Where the HUD is (top bar, sidebar or off) and which parts it shows (players, ping, server speed, FPS).
    usage: /hud [top|side|off] | /hud hide|show <part> | /hud minimal | /hud full | /hud parts | /hud reset
    permission: mcbrand.hud
  modpack:
    description: Your personal link to the server's optional client (smoother FPS, further views).
    usage: /modpack [off|on]
    permission: mcbrand.modpack
  view:
    description: Your own view distance (higher only while the server runs smoothly).
    usage: /view [number|reset]
    permission: mcbrand.view
  compass:
    description: The friend compass at the top of the screen (hide = keep yourself off others' compasses and maps).
    usage: /compass [on|off|hide|show|auto]
    permission: mcbrand.compass
  map:
    description: A pocket map that follows you and shows your friends.
    usage: /map [zoom]
    permission: mcbrand.map
  help:
    description: The commands you can use here (vanilla's list is /minecraft:help).
    aliases: [commands]
    permission: mcbrand.help
  mcbrand:
    description: mc-brand status and self-test (operators and the console).
    usage: /mcbrand status|selftest
    permission: mcbrand.admin
permissions:
  mcbrand.rules:
    default: true
  mcbrand.discord:
    default: true
  mcbrand.drink:
    default: true
  mcbrand.hud:
    default: true
  mcbrand.modpack:
    default: true
  mcbrand.view:
    default: true
  mcbrand.compass:
    default: true
  mcbrand.map:
    default: true
  mcbrand.help:
    default: true
  mcbrand.admin:
    default: op
