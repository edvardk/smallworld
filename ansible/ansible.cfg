[defaults]
roles_path = roles
library = library
interpreter_python = auto_silent
callback_result_format = yaml
forks = 5
# No default inventory: it is rendered from the config repo (-i <config>/.mcctl/rendered/ansible/inventory.yml).
# Secrets come from MC_SECRET_* environment variables (group_vars/all/secrets.yml), never from files.

[ssh_connection]
pipelining = True
# Tailscale SSH authenticates the connection; host keys are trust-on-first-use (CI runners are fresh).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
