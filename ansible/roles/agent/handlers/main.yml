- name: Restart mc-agent
  ansible.builtin.systemd_service:
    name: mc-agent.service
    state: restarted
    daemon_reload: true

# v1.2.3: the base role's script install notifies this pair. A handler flush can run it before the agent role
# installed the unit (a fresh box: the minecraft role flushes handlers mid-play), and boxes without the panel
# (panel.mode other than cloudflare) never have it: restart only an installed mc-agent.
- name: Is mc-agent installed (its code changed)?
  ansible.builtin.stat:
    path: /etc/systemd/system/mc-agent.service
  register: agent_unit_for_code_change
  listen: mc-agent code changed

- name: Restart mc-agent (its code changed)
  ansible.builtin.systemd_service:
    name: mc-agent.service
    state: restarted
    daemon_reload: true
  when: agent_unit_for_code_change.stat.exists
  listen: mc-agent code changed

# v1.4: the telemetry sidecar (rust mode) runs telemetry.py and reads agent.env: a code change (the base role's
# scripts, binary, product version) or a new environment restarts it too, after mc-agent (handlers run in this
# order), and only where it is installed.
- name: Is the telemetry sidecar installed?
  ansible.builtin.stat:
    path: /etc/systemd/system/mc-telemetry.service
  register: agent_sidecar_for_change
  listen: [mc-agent code changed, mc-telemetry changed]

- name: Restart the telemetry sidecar
  ansible.builtin.systemd_service:
    name: mc-telemetry.service
    state: restarted
    daemon_reload: true
  when: agent_sidecar_for_change.stat.exists
  listen: [mc-agent code changed, mc-telemetry changed]
