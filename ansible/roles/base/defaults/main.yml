# v1.4: the smallworld-rcon binary for this box (rust/dist/, pinned by mc_smallworld_rcon_sha256): Debian's name for
# the architecture (the pin's key, as backups_arch for restic) and the Rust target it was built for. Any other
# architecture fails here, as restic's download would.
base_rcon_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
base_rcon_target: "{{ {'amd64': 'x86_64-unknown-linux-musl', 'arm64': 'aarch64-unknown-linux-musl'}[base_rcon_arch] }}"
base_rcon_src: "{{ playbook_dir }}/../rust/dist/smallworld-rcon-{{ base_rcon_target }}"
