# mc_overlay_check=true: compare only (check mode); any difference notifies the restart handler. v1.3: against the
# staged copy when a restart waits for the maintenance window (tasks/defer.yml), so a second deploy outside the
# window reports no change for what is already staged.
# mc_overlay_check=false: write changes (only while the server is stopped).
- name: Check config overlays
  mc_config:
    path: "{{ mc_server_dir }}/{{ item.path }}"
    format: "{{ item.format }}"
    settings: "{{ lookup('ansible.builtin.template', mc_config_dir ~ '/' ~ item.template) | from_yaml }}"
    create: "{{ item.create | default(false) }}"
    stage: "{{ mc_restart_pending_dir }}/files/{{ item.path }}"
  become: true
  become_user: minecraft
  check_mode: true
  loop: "{{ mc_overlays }}"
  loop_control:
    label: "{{ item.path }}"
  when: mc_overlay_check | bool
  notify: restart minecraft

- name: Apply config overlays
  mc_config:
    path: "{{ mc_server_dir }}/{{ item.path }}"
    format: "{{ item.format }}"
    settings: "{{ lookup('ansible.builtin.template', mc_config_dir ~ '/' ~ item.template) | from_yaml }}"
    create: "{{ item.create | default(false) }}"
  become: true
  become_user: minecraft   # files the server rewrites must stay owned by it
  loop: "{{ mc_overlays }}"
  loop_control:
    label: "{{ item.path }}"
  when: not (mc_overlay_check | bool)
