- name: Check the pinned Temurin matches the Java version Minecraft requires
  ansible.builtin.assert:
    that: temurin_version.startswith(server_lock.java_major | string ~ '.')
    fail_msg: >-
      server.lock.yml needs Java {{ server_lock.java_major }} but temurin_version is {{ temurin_version }}.
    quiet: true

- name: Install apt repo prerequisites
  ansible.builtin.apt:
    name: [python3-debian, ca-certificates]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Adoptium apt repository
  ansible.builtin.deb822_repository:
    name: adoptium
    types: [deb]
    uris: https://packages.adoptium.net/artifactory/deb
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: https://packages.adoptium.net/artifactory/api/gpg/key/public
  register: java_repo
  # packages.adoptium.net answers 503 TooManyRequests now and then (v1.0.1: seen in CI): retry, don't fail the deploy
  retries: 5
  delay: 30
  until: java_repo is succeeded

- name: Refresh apt cache after adding the repo
  ansible.builtin.apt:
    update_cache: true
  when: java_repo.changed  # noqa: no-handler
  register: java_cache
  retries: 5
  delay: 30
  until: java_cache is succeeded

- name: Install pinned Temurin JRE
  ansible.builtin.apt:
    name: "temurin-{{ server_lock.java_major }}-jre={{ temurin_version }}"
    state: present
    allow_change_held_packages: true
  register: java_install
  retries: 5
  delay: 30
  until: java_install is succeeded
  notify: restart minecraft

- name: Hold Temurin at the pinned version
  ansible.builtin.dpkg_selections:
    name: "temurin-{{ server_lock.java_major }}-jre"
    selection: hold

- name: Locate the java binary
  ansible.builtin.stat:
    path: "{{ java_home }}/bin/java"
  register: java_bin
  failed_when: not java_bin.stat.exists
