# Secrets, read from the environment at run time: no values are stored in git (design §3).
# Terraform is the only store. CI maps Actions secrets to MC_SECRET_* (.github/workflows/deploy.yml);
# locally `python -m mcctl deploy` sets them from `terraform output -json`. The list of names lives in
# mcctl/secrets.py (tests/test_consistency.py checks this file against it). Unset = ""; site.yml fails
# early when a required one is empty. Tasks that write these values use no_log.
mc_secret_rcon_password: "{{ lookup('ansible.builtin.env', 'MC_SECRET_RCON_PASSWORD') }}"
mc_secret_restic_password: "{{ lookup('ansible.builtin.env', 'MC_SECRET_RESTIC_PASSWORD') }}"
mc_secret_restic_repository: "{{ lookup('ansible.builtin.env', 'MC_SECRET_RESTIC_REPOSITORY') }}"
mc_secret_r2_access_key_id: "{{ lookup('ansible.builtin.env', 'MC_SECRET_R2_ACCESS_KEY_ID') }}"
mc_secret_r2_secret_access_key: "{{ lookup('ansible.builtin.env', 'MC_SECRET_R2_SECRET_ACCESS_KEY') }}"
mc_secret_heartbeat_token: "{{ lookup('ansible.builtin.env', 'MC_SECRET_HEARTBEAT_TOKEN') }}"
mc_secret_agent_token: "{{ lookup('ansible.builtin.env', 'MC_SECRET_AGENT_TOKEN') }}"
mc_secret_command_hmac_key: "{{ lookup('ansible.builtin.env', 'MC_SECRET_COMMAND_HMAC_KEY') }}"
mc_secret_discord_webhook_url: "{{ lookup('ansible.builtin.env', 'MC_SECRET_DISCORD_WEBHOOK_URL') }}"
