# v1.2 seed catalogue for the world library (the panel's Worlds tab: New world > Start from).
#
# Researched seeds for the pinned Minecraft version (template/server.lock.yml), each with the page it was found on.
# Only claims that `python scripts/seed_check.py verify` confirmed on the pinned server build are kept here: it boots
# the jar per seed and measures each claim with /locate from the world spawn (the Nether: from spawn / 8, where a
# portal at spawn leads; the End: from the main island). The source pages' own highlights that the check could not
# confirm (or that /locate can't see, such as chest loot) are left out. watchdog/panel/seeds.json holds the
# measurements; tests/test_seeds.py and ci.yml's `seeds` job keep the two in step (docs/operations.md, World library).
#
# Fields: id (1-40 lowercase letters, digits, -), name (<= 60 chars), seed (quoted 64-bit integer), description
# (<= 200 chars), source (https URL), claims: structure (id or #tag) or biome, within (blocks), optional dimension
# (overworld | nether | end) and label.

